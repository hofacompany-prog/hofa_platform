name: hofa_customer
description: "HOFA — Web đặt hàng cho khách (hofa.com.vn)"
publish_to: 'none'
version: 2.2.1+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  geolocator: ^14.0.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  image_picker: ^1.1.2
  share_plus: ^13.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# Sinh icon Android/iOS từ assets/icon/icon.png (ảnh gốc vuông, không alpha — bắt buộc cho iOS) —
# chạy `dart run flutter_launcher_icons` sau khi đổi ảnh gốc. Icon Android trước đây đặt tay từng
# mật độ (mipmap-*), lệnh này thay bằng bộ sinh đúng chuẩn + thêm cả bộ icon iOS còn thiếu.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
