<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HOFA — Quản lý cửa hàng: sản phẩm, đơn hàng, tồn kho.">

  <!-- Màu thanh trạng thái/thanh địa chỉ trình duyệt khi cài PWA — khớp màu thương hiệu -->
  <meta name="theme-color" content="#85C100">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HOFA Store">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HOFA Store</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->

  <!-- Chẩn đoán tạm thời: log ngay lúc trang tải, để biết chính xác app thực sự mở ở URL nào
       lúc bấm push từ trạng thái tắt hẳn — xem qua Safari Web Inspector (Mac > Safari > Develop
       > tên iPhone > tên trang). Xoá đoạn này sau khi tìm ra nguyên nhân. -->
  <script>
    console.log('[hofa-index] Trang tải ở URL =', window.location.href);
  </script>

  <!-- Xoá badge trên icon PWA (Badging API) mỗi khi mở/quay lại app — badge được cộng ở
       firebase-messaging-sw.js lúc app không mở, dùng chung 1 IndexedDB store để đếm. -->
  <script>
    (function () {
      if (!('clearAppBadge' in navigator)) return;
      function clearBadge() {
        navigator.clearAppBadge().catch(function () {});
        if (!('indexedDB' in window)) return;
        var req = indexedDB.open('hofa-badge', 1);
        req.onupgradeneeded = function () {
          req.result.createObjectStore('counter');
        };
        req.onsuccess = function () {
          var tx = req.result.transaction('counter', 'readwrite');
          tx.objectStore('counter').put(0, 'count');
        };
      }
      clearBadge();
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') clearBadge();
      });
    })();
  </script>

  <!-- Đọc + xoá đường dẫn service worker ghi lúc bấm push (xem
       web/firebase-messaging-sw.js#writePendingDeepLink) — gọi từ Dart qua
       lib/core/pending_deep_link_web.dart. Bù cho việc app cài kiểu PWA/WebAPK trên Android
       có thể bỏ qua URL truyền vào clients.openWindow()/client.navigate() lúc mở lại từ
       thông báo khi đã tắt hẳn, luôn khởi động lại ở start_url của manifest.json. -->
  <script>
    window.hofaReadPendingDeepLink = function () {
      return new Promise(function (resolve) {
        if (!('indexedDB' in window)) {
          console.log('[hofa-index] indexedDB không tồn tại trong window');
          return resolve(null);
        }
        var req = indexedDB.open('hofa-badge', 1);
        req.onupgradeneeded = function () { req.result.createObjectStore('counter'); };
        req.onsuccess = function () {
          var tx = req.result.transaction('counter', 'readwrite');
          var store = tx.objectStore('counter');
          var getReq = store.get('pendingDeepLink');
          getReq.onsuccess = function () {
            var path = getReq.result || null;
            console.log('[hofa-index] hofaReadPendingDeepLink() đọc được =', path);
            if (path) store.delete('pendingDeepLink');
            resolve(path);
          };
          getReq.onerror = function (e) {
            console.log('[hofa-index] hofaReadPendingDeepLink() lỗi đọc', e);
            resolve(null);
          };
        };
        req.onerror = function (e) {
          console.log('[hofa-index] hofaReadPendingDeepLink() lỗi mở DB', e);
          resolve(null);
        };
      });
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
